[package]
name = "m-theory"
version = "0.1.0"
description = "M-Theory: write songs, record vocals"
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.90"

[lib]
name = "m_theory_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18"
rtrb = "0.3"
hound = "3.5"

# On Windows the app talks to audio interfaces through their ASIO drivers (Steinberg ASIO SDK, GPLv3 option).
[target.'cfg(target_os = "windows")'.dependencies]
cpal = { version = "0.18", features = ["asio"] }
# the audio thread joins the "Pro Audio" scheduler class; no power throttling or sleep while recording;
# how much room the disk has left for a long recording
windows-sys = { version = "0.61", features = ["Win32_System_Threading", "Win32_System_Power", "Win32_Foundation", "Win32_Storage_FileSystem"] }

# how much room the disk has left (elsewhere than Windows: for development and the tests)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
